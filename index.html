<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daily Collection & Expense Entry</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f4f5f7);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111111);
      --btn: var(--tg-theme-button-color, #007aff);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }
    .header-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .header-bar input {
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .row-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      border-left: 4px solid #10b981; /* Green for collection default */
    }
    .row-card.is-expense {
      border-left-color: #ef4444; /* Red for expense */
    }
    .pill-group {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .pill-btn {
      flex: 1;
      padding: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background: #f8fafc;
      cursor: pointer;
    }
    .pill-btn.active-col {
      background: #dcfce7;
      color: #15803d;
      border-color: #86efac;
    }
    .pill-btn.active-exp {
      background: #fee2e2;
      color: #b91c1c;
      border-color: #fca5a5;
    }
    .row-grid {
      display: grid;
      grid-template-columns: 1fr 100px;
      gap: 8px;
      margin-bottom: 8px;
    }
    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 38px;
      gap: 8px;
      align-items: center;
    }
    input, select {
      width: 100%;
      padding: 9px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .del-btn {
      background: #f1f5f9;
      color: #64748b;
      border: none;
      border-radius: 6px;
      height: 38px;
      cursor: pointer;
      font-size: 1.1rem;
    }
    .del-btn:disabled {
      color: #cbd5e1;
      cursor: not-allowed;
    }
    .add-btn {
      width: 100%;
      padding: 12px;
      background: #eef2ff;
      color: #3730a3;
      border: 1px dashed #6366f1;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .summary-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .summary-row.total {
      font-weight: bold;
      border-top: 1px solid #cbd5e1;
      padding-top: 6px;
      margin-top: 6px;
      font-size: 0.95rem;
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--btn);
      color: var(--btn-text);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .cache-status {
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <input type="date" id="entryDate" style="flex: 1;">
    <input type="number" id="openingBal" placeholder="Opening Bal (₹)" style="flex: 1;" title="Carried cash balance">
  </div>

  <div id="cacheStatus" class="cache-status">Loading customers from buffer...</div>

  <!-- Shared Datalist for Customers & Common Expenses -->
  <datalist id="customerList"></datalist>
  <datalist id="expensePresets">
    <option value="Ladder rent (3)">[cite: 7]
    <option value="Cool water (office)">[cite: 7]
    <option value="Stay wire">[cite: 10]
    <option value="Print pad / pod">[cite: 3]
    <option value="Office tea/snacks">
    <option value="Petrol / Conveyance">
    <option value="Hardware / OFC materials">
  </datalist>

  <form id="batchForm">
    <div id="rowsContainer"></div>

    <button type="button" class="add-btn" id="addRowBtn">+ Add Another Entry</button>

    <!-- Real-time Balance Summary -->
    <div class="summary-card">
      <div class="summary-row"><span>Opening Balance (OB):</span> <span id="dispOb">₹0</span></div>
      <div class="summary-row"><span>Total Collections:</span> <span id="dispCol">₹0</span></div>
      <div class="summary-row"><span>Less Online (Phb/Bank):</span> <span id="dispOnline">-₹0</span></div>
      <div class="summary-row"><span>Less Cash Expenses:</span> <span id="dispExp">-₹0</span></div>
      <div class="summary-row"><span>Less to Vijay Anna:</span> <span id="dispAnna">-₹0</span></div>
      <div class="summary-row total"><span>Closing Cash in Hand:</span> <span id="dispCash">₹0</span></div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Submit Day Report</button>
  </form>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // !!! PASTE YOUR DEPLOYED APPS SCRIPT URL HERE !!!
    const SCRIPT_URL = "YOUR_APPS_SCRIPT_URL";

    document.getElementById("entryDate").value = new Date().toISOString().split('T')[0];
    document.getElementById("openingBal").addEventListener("input", calculateTotals);

    // Fast-loading from backend 6-hour buffer
    async function loadBufferedCustomers() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        const datalist = document.getElementById("customerList");
        datalist.innerHTML = "";
        if (data.customers && data.customers.length > 0) {
          data.customers.forEach(name => {
            const opt = document.createElement("option");
            opt.value = name;
            datalist.appendChild(opt);
          });
          document.getElementById("cacheStatus").innerText = `⚡ ${data.customers.length} users buffered (Instant Load)`;
        } else {
          document.getElementById("cacheStatus").innerText = "Type names directly";
        }
      } catch (err) {
        document.getElementById("cacheStatus").innerText = "Ready (Offline Buffer)";
      }
    }
    loadBufferedCustomers();

    const container = document.getElementById("rowsContainer");

    function createRow(type = "collection", defaultDesc = "", defaultAmt = "", defaultMode = "Cash") {
      const rowId = 'row_' + Date.now() + Math.random().toString(36).substring(2, 5);
      const div = document.createElement("div");
      div.className = `row-card ${type === 'expense' ? 'is-expense' : ''}`;
      div.id = rowId;

      div.innerHTML = `
        <div class="pill-group">
          <div class="pill-btn ${type === 'collection' ? 'active-col' : ''}" onclick="setType('${rowId}', 'collection')">📥 Collection (In)</div>
          <div class="pill-btn ${type === 'expense' ? 'active-exp' : ''}" onclick="setType('${rowId}', 'expense')">📤 Expense / Debit (Out)</div>
        </div>
        <div class="row-grid">
          <input type="text" 
                 list="${type === 'collection' ? 'customerList' : 'expensePresets'}" 
                 class="inp-desc" 
                 placeholder="${type === 'collection' ? 'Customer name...' : 'Expense item (e.g. ladder rent)...'}" 
                 value="${defaultDesc}" 
                 required autocomplete="off">
          <input type="number" class="inp-amount" placeholder="₹ Amount" value="${defaultAmt}" required>
        </div>
        <div class="mode-grid">
          <select class="inp-mode">
            <option value="Cash" ${defaultMode === 'Cash' ? 'selected' : ''}>Cash</option>
            <option value="Phb" ${defaultMode === 'Phb' ? 'selected' : ''}>Phb (PhonePe)</option>
            <option value="Vijay A/c" ${defaultMode === 'Vijay A/c' ? 'selected' : ''}>Vijay A/c</option>
            <option value="Vijay Anna" ${defaultMode === 'Vijay Anna' ? 'selected' : ''}>Handed to Vijay Anna</option>
          </select>
          <button type="button" class="del-btn" onclick="removeRow('${rowId}')">✕</button>
        </div>
      `;
      container.appendChild(div);

      div.querySelector(".inp-amount").addEventListener("input", calculateTotals);
      div.querySelector(".inp-mode").addEventListener("change", calculateTotals);

      updateDeleteButtons();
      calculateTotals();
    }

    window.setType = function(rowId, newType) {
      const row = document.getElementById(rowId);
      const pills = row.querySelectorAll(".pill-btn");
      const input = row.querySelector(".inp-desc");

      if (newType === 'collection') {
        row.classList.remove("is-expense");
        pills[0].className = "pill-btn active-col";
        pills[1].className = "pill-btn";
        input.setAttribute("list", "customerList");
        input.placeholder = "Customer name...";
      } else {
        row.classList.add("is-expense");
        pills[0].className = "pill-btn";
        pills[1].className = "pill-btn active-exp";
        input.setAttribute("list", "expensePresets");
        input.placeholder = "Expense item (e.g. ladder rent)...";
      }
      calculateTotals();
    };

    window.removeRow = function(id) {
      const cards = document.querySelectorAll(".row-card");
      if (cards.length > 1) {
        document.getElementById(id).remove();
        updateDeleteButtons();
        calculateTotals();
      }
    };

    function updateDeleteButtons() {
      const cards = document.querySelectorAll(".row-card");
      const delButtons = document.querySelectorAll(".del-btn");
      if (cards.length === 1) {
        delButtons[0].disabled = true;
      } else {
        delButtons.forEach(btn => btn.disabled = false);
      }
    }

    function calculateTotals() {
      const ob = parseFloat(document.getElementById("openingBal").value) || 0;
      let totalCol = 0, onlineIn = 0, cashExp = 0, anna = 0;

      const cards = document.querySelectorAll(".row-card");
      cards.forEach(card => {
        const isExpense = card.classList.contains("is-expense");
        const amt = parseFloat(card.querySelector(".inp-amount").value) || 0;
        const mode = card.querySelector(".inp-mode").value;

        if (isExpense) {
          if (mode === "Vijay Anna") {
            anna += amt;
          } else if (mode === "Cash") {
            cashExp += amt;
          }
        } else {
          totalCol += amt;
          if (mode === "Phb" || mode === "Vijay A/c") {
            onlineIn += amt;
          }
        }
      });

      const cashCollected = totalCol - onlineIn;
      const closingCash = (ob + cashCollected) - cashExp - anna;

      document.getElementById("dispOb").innerText = `₹${ob}`;
      document.getElementById("dispCol").innerText = `₹${totalCol}`;
      document.getElementById("dispOnline").innerText = `-₹${onlineIn}`;
      document.getElementById("dispExp").innerText = `-₹${cashExp}`;
      document.getElementById("dispAnna").innerText = `-₹${anna}`;
      document.getElementById("dispCash").innerText = `₹${closingCash}`;
    }

    document.getElementById("addRowBtn").addEventListener("click", () => createRow());

    // Starts with 1 row
    createRow();

    // Submission
    document.getElementById("batchForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const cards = document.querySelectorAll(".row-card");
      const entries = [];

      cards.forEach(card => {
        const desc = card.querySelector(".inp-desc").value.trim();
        const amt = card.querySelector(".inp-amount").value;
        const mode = card.querySelector(".inp-mode").value;
        const type = card.classList.contains("is-expense") ? "expense" : "collection";

        if (desc && amt) {
          entries.push({ customer: desc, amount: amt, mode: mode, type: type });
        }
      });

      if (entries.length === 0) {
        alert("Please enter at least one entry.");
        return;
      }

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting entries...";

      const payload = {
        date: document.getElementById("entryDate").value,
        openingBalance: document.getElementById("openingBal").value || 0,
        agent: tg?.initDataUnsafe?.user?.first_name || "Agent",
        entries: entries
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        alert("Report submitted successfully!");
        if (tg) tg.close();
      } catch (err) {
        alert("Error saving: " + err.message);
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Day Report";
      }
    });
  </script>
</body>
</html>
